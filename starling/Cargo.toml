[package]
name = "starlingmonkey"
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "starling"
path = "src/main.rs"
test = false

[features]
debugmozjs = ['libstarling/debugmozjs']
profilemozjs = ['js/profilemozjs']
jitspew = ['js/jitspew']
intl = ['js/intl']

[dependencies]
# `core-runtime` and `js` carry no direct use in `main.rs`: the former is needed by the `examples/`
# (whose `#[jsmodule]` expansions name it), the latter backs the `profilemozjs`/`jitspew`/`intl`
# features above.
core-runtime.workspace = true
js.workspace = true
libstarling.workspace = true
wasip3.workspace = true
# Pinned to the version `wasip3` itself uses, rather than the workspace's. Both generate a
# `run_ctors_once` guarded by its own static, so two versions in one component means the C++
# constructors run twice — which a Wizer-resumed instance trips immediately (SpiderMonkey's
# `InitializeUptime` asserts it is called once).
#
# `inter-task-wakeup` lets one wit task wake another through plain Rust wakers, which the serve
# path needs: the response-body writer task parks on a Rust channel the request's event-loop
# drain task feeds (and the drain's body-done signal crosses back the other way). Without it the
# executor panics the moment such a task is the only thing left to sleep on — any long-lived
# streamed response (server-sent events, say) hit that.
wit-bindgen = { workspace = true, features = ["macros", "inter-task-wakeup"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
