[workspace.package]
version = "0.3.0"
repository = "https://github.com/bytecodealliance/starlingmonkey"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["The StarlingMonkey project contributors"]
edition = "2021"

[workspace]
members = [
    "starling",
    "crates/platform",
    "crates/builtins/*",
]
default-members = ["starling"]
exclude = ["crown"]

resolver = "2"

[workspace.dependencies]
bitflags = "2"
bytes = "1"
clap = { version = "4.5.60", features = ["derive"] }
core-runtime = { path = "crates/core-runtime" }
data-url = "0.3"
encoding_rs = "0.8"
event-listener = "5"
form_urlencoded = "1.2"
futures-channel = "0.3"
futures-lite = "2"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
js = { path = "crates/js" }
libstarling = { path = "crates/libstarling" }
oxc_allocator = "0.142.0"
oxc_ast = "0.142.0"
oxc_parser = "0.142.0"
oxc_resolver = "11"
oxc_span = "0.142.0"
platform = { path = "crates/platform" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serve-test-support = { path = "crates/serve-test-support" }
starling-macro = { path = "crates/starling-macro" }
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
url = "2.5.8"
uuid = { version = "1.23", features = ["v4"] }
wasip3 = { version = "0.8.0", features = ["http-compat"] }
wit-bindgen = { version = "=0.61.0", features = ["macros"] }
wpt-support = { path = "crates/wpt-support" }

# bindgen = { version = "0.72", default-features = false, features = [
#     "runtime",
#     "prettyplease",
#     "experimental",
# ] }

# Builtins
fetch-event = { path = "crates/builtins/fetch-event" }
simple-http = { path = "crates/builtins/simple-http" }
web-fetch = { path = "crates/builtins/web-fetch" }
web-globals = { path = "crates/builtins/web-globals" }
web-streams = { path = "crates/builtins/web-streams" }
web-url = { path = "crates/builtins/web-url" }
cpp-builtins = { path = "crates/builtins/cpp-builtins" }


[profile.release]
lto = "thin"
panic = 'abort'
strip = "symbols"

[profile.dev]
lto = false

# [profile.dev.build-override]
# opt-level = 3

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)'] }

[workspace.lints.clippy]
too_many_arguments = "allow"
