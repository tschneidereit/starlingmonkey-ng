[package]
name = "cpp-builtins"
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[features]
debugmozjs = []

[dependencies]
js.workspace = true
# Feature-matched to the `js` crate: cargo unifies features across the graph, so leaving mozjs's
# defaults on here would pull `libz-sys` back in for every build.
mozjs = { git = "https://github.com/tschneidereit/mozjs.git", branch = "main", default-features = false, features = [
  "jit",
  "libz-rs",
  "intl",
] }
mozjs_sys = { git = "https://github.com/tschneidereit/mozjs.git", branch = "main" }

[build-dependencies]
cc = "1.2.56"

[dev-dependencies]
core-runtime.workspace = true
libstarling.workspace = true
