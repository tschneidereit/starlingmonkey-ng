name: Setup build environment
description: Install system deps, Rust toolchain, WASI SDK, wasmtime, and configure sccache.

inputs:
  target:
    description: 'Build target: "native", "wasm32-wasip2" or "wasm32-wasip3"'
    required: true

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 m4 libclang-dev llvm

    - name: Install just
      shell: bash
      run: |
        mkdir -p "$HOME/.just/bin"
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
          | bash -s -- --to "$HOME/.just/bin"
        echo "$HOME/.just/bin" >> "$GITHUB_PATH"

    - name: Install Rust toolchain
      shell: bash
      run: rustup show

    - name: Add wasm32-wasip2 target
      if: inputs.target == 'wasm32-wasip2'
      shell: bash
      run: rustup target add wasm32-wasip2

    # The pinned toolchain ships no wasm32-wasip3 std, so the justfile builds that target with
    # `cargo +nightly`. The pinned toolchain is still needed for the host-side test harnesses.
    - name: Install nightly Rust toolchain with the wasm32-wasip3 target
      if: inputs.target == 'wasm32-wasip3'
      shell: bash
      run: |
        rustup toolchain install nightly --profile minimal --target wasm32-wasip3
        rustc +nightly --version

    - name: Install WASI SDK
      if: inputs.target != 'native'
      shell: bash
      run: |
        sudo mkdir -p /opt/wasi-sdk
        curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
          | sudo tar xz --strip-components=1 -C /opt/wasi-sdk
        echo "WASI_SDK_PATH=/opt/wasi-sdk" >> "$GITHUB_ENV"

    - name: Install wasmtime
      if: inputs.target != 'native'
      shell: bash
      run: |
        curl -sSf https://wasmtime.dev/install.sh | bash
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
